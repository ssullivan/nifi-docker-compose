---
services:
  nifi:
    image: apache/nifi:1.19.1
    deploy:
      replicas: 1
    ports:
      - "8443:8443"
    environment:
      - AUTH=tls
      - KEYSTORE_PATH=/run/secrets/server_p12
      - KEYSTORE_TYPE=PKCS12
      - KEYSTORE_PASSWORD=changeit
      - TRUSTSTORE_PATH=/run/secrets/ca_p12
      - TRUSTSTORE_TYPE=PKCS12
      - TRUSTSTORE_PASSWORD=changeit
      - INITIAL_ADMIN_IDENTITY=CN=NifiAdmin,O=Test,L=Baltimore,ST=MD,C=US
    secrets:
      - ca_p12
      - ca_crt
      - ca_key
      - server_p12
      - server_crt
      - server_key
    volumes:
      - type: volume
        source: conf
        target: /opt/nifi/current/conf
      - type: volume
        source: content
        target: /opt/nifi/current/content_repository
      - type: volume
        source: db
        target: /opt/nifi/current/database_repository
      - type: volume
        source: flowfile
        target: /opt/nifi/current/flowfile_repository
      - type: volume
        source: provenance
        target: /opt/nifi/current/provenance_repository
      - type: volume
        source: logs
        target: /opt/nifi/current/logs
      - type: volume
        source: data
        target: /opt/nifi/current/data
volumes:
  conf:
  content:
  db:
  flowfile:
  provenance:
  logs:
  data:

secrets:
  # You will need to run the shell scripts for this to work
  ca_p12:
    file: ../certs/ca.p12
  ca_crt:
    file: ../certs/ca_crt.pem
  ca_key:
    file: ../certs/ca_key.pem
  server_p12:
    file: ../certs/server.p12
  server_crt:
    file: ../certs/server_crt.pem
  server_key:
    file: ../certs/server_key.pem
...
