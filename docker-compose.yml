---
# Single-node NiFi with two-way TLS (client certificate) authentication.
# NiFi 2.x is HTTPS-only, so there is no separate "plain" stack -- run
# `just certs-all` before the first `just up`.
services:
  nifi:
    image: apache/nifi:2.11.0
    ports:
      - "8443:8443"
    environment:
      - AUTH=tls
      # The default bind is $HOSTNAME, which is the container id.
      - NIFI_WEB_HTTPS_HOST=0.0.0.0
      - NIFI_WEB_HTTPS_PORT=8443
      # 2.x warns that a port-mapped UI may be unreachable without this, and
      # rejects Host headers that are not listed here.
      - NIFI_WEB_PROXY_HOST=localhost:8443,127.0.0.1:8443
      - KEYSTORE_PATH=/run/secrets/server_p12
      - KEYSTORE_TYPE=PKCS12
      - KEYSTORE_PASSWORD=${CERT_PASSWORD:-changeit}
      # PKCS12 only. NiFi 2.11 rejects TRUSTSTORE_TYPE=PEM at startup even
      # though the image's secure.sh advertises it -- see certs/create-ca.sh.
      - TRUSTSTORE_PATH=/run/secrets/ca_p12
      - TRUSTSTORE_TYPE=PKCS12
      - TRUSTSTORE_PASSWORD=${CERT_PASSWORD:-changeit}
      # Must match `just certs-dn` exactly, or NiFi authenticates the cert but
      # authorizes nothing (200 with every permission false). Changing it needs
      # `just clean-volumes` first. Note the spaces after each comma: NiFi
      # renders the DN that way, and without them the admin seed never matches.
      - INITIAL_ADMIN_IDENTITY=CN=NifiAdmin, O=Test, L=Baltimore, ST=MD, C=US
    secrets:
      - server_p12
      - ca_p12
    volumes:
      - type: volume
        source: conf
        target: /opt/nifi/nifi-current/conf
      - type: volume
        source: content
        target: /opt/nifi/nifi-current/content_repository
      - type: volume
        source: db
        target: /opt/nifi/nifi-current/database_repository
      - type: volume
        source: flowfile
        target: /opt/nifi/nifi-current/flowfile_repository
      - type: volume
        source: provenance
        target: /opt/nifi/nifi-current/provenance_repository
      - type: volume
        source: state
        target: /opt/nifi/nifi-current/state
      - type: volume
        source: logs
        target: /opt/nifi/nifi-current/logs
volumes:
  conf:
  content:
  db:
  flowfile:
  provenance:
  state:
  logs:

secrets:
  # Generated by `just certs-all`. Only the keystore and truststore are mounted
  # -- the loose ca_key.pem/ca_crt.pem/server_*.pem are not, since nothing in
  # the container reads them.
  server_p12:
    file: ./certs/server.p12
  ca_p12:
    file: ./certs/ca.p12
...
